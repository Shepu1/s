<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>EverydayBD Shop</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family: Arial, sans-serif;
    }

    body{
      min-height:100vh;
      background: linear-gradient(135deg, #0f2027, #14532d, #22c55e);
      overflow-x:hidden;
    }

    /* Stylish Navbar */

    .navbar{
      width:100%;
      display:flex;
      justify-content:center;
      align-items:center;
      padding:18px 40px;
      position:fixed;
      top:0;
      left:0;
      z-index:1000;

      background: rgba(255,255,255,0.08);
      backdrop-filter: blur(12px);

      border-bottom:1px solid rgba(255,255,255,0.15);
      box-shadow:0 5px 25px rgba(0,0,0,0.2);
    }

    .nav-links{
      display:flex;
      align-items:center;
      list-style:none;
      gap:15px;
    }

    .nav-links li a{
      position:relative;
      text-decoration:none;
      color:white;
      font-size:17px;
      font-weight:bold;
      padding:12px 22px;
      border-radius:30px;
      transition:0.35s ease;
      overflow:hidden;
    }

    .nav-links li a::before{
      content:'';
      position:absolute;
      inset:0;
      background:rgba(255,255,255,0.12);
      border-radius:30px;
      transform:scale(0);
      transition:0.35s ease;
      z-index:-1;
    }

    .nav-links li a:hover::before{
      transform:scale(1);
    }

    .nav-links li a:hover{
      color:#d1fae5;
      box-shadow:0 0 18px rgba(255,255,255,0.15);
    }

    /* Active Nav */

    .nav-links li.active a{
      background:white;
      color:#14532d;
      box-shadow:0 0 20px rgba(255,255,255,0.4);
    }

    .nav-links li.active a:hover{
      color:#14532d;
    }

    /* Hamburger */

    .hamburger{
      display:none;
      flex-direction:column;
      cursor:pointer;
      gap:6px;
      position:absolute;
      right:20px;
    }

    .line{
      width:30px;
      height:3px;
      background:white;
      border-radius:10px;
      transition:0.3s;
    }

    /* Main Section */

    .container{
      min-height:100vh;
      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:center;
      text-align:center;
      padding:100px 20px 20px;
    }

    h1{
      color:white;
      font-size:58px;
      margin-bottom:35px;
      text-shadow:0 0 20px rgba(255,255,255,0.5);
    }

    .btn{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:12px;
      padding:18px 50px;
      font-size:22px;
      font-weight:bold;
      color:#14532d;
      text-decoration:none;
      border-radius:50px;
      background:white;
      border:3px solid #22c55e;
      box-shadow:0 0 25px rgba(34,197,94,0.7);
      transition:0.35s ease;
      position:relative;
      overflow:hidden;
      max-width:100%;
    }

    .btn:hover{
      background:#22c55e;
      color:white;
      transform:scale(1.05);
      box-shadow:0 0 40px rgba(34,197,94,1);
    }

    .btn::before{
      content:'';
      position:absolute;
      top:0;
      left:-100%;
      width:100%;
      height:100%;
      background:rgba(255,255,255,0.25);
      transform:skewX(-25deg);
      transition:0.6s;
    }

    .btn:hover::before{
      left:120%;
    }

    .arrow{
      font-size:26px;
      transition:0.3s;
    }

    .btn:hover .arrow{
      transform:translateX(6px);
    }

    /* Mobile */

    @media (max-width: 768px){

      .navbar{
        justify-content:flex-end;
        padding:18px 20px;
      }

      .hamburger{
        display:flex;
      }

      .nav-links{
        position:absolute;
        top:80px;
        right:-100%;
        width:240px;

        flex-direction:column;
        align-items:center;
        gap:18px;

        padding:30px 20px;

        background:rgba(20, 83, 45, 0.98);
        backdrop-filter: blur(15px);

        border-radius:20px;
        border:1px solid rgba(255,255,255,0.12);

        box-shadow:0 10px 30px rgba(0,0,0,0.3);

        transition:0.4s ease;
      }

      .nav-links.active{
        right:20px;
      }

      .nav-links li{
        width:100%;
      }

      .nav-links li a{
        display:block;
        width:100%;
        text-align:center;
      }

      h1{
        font-size:40px;
      }

      .btn{
        width:100%;
        max-width:320px;
        padding:16px 20px;
        font-size:20px;
        border-radius:20px;
      }
    }

    @media (max-width: 400px){

      h1{
        font-size:32px;
      }

      .btn{
        font-size:18px;
      }
    }

  </style>
</head>
<body>

    <nav class="navbar">

        <ul class="nav-links" id="navLinks">

            <li><a href="index.html">Home</a></li>

            <li><a href="contact.html">Contact</a></li>

            <li><a href="Apps&Games.html">Apps & Games</a></li>

            <li class="active"><a href="Buy.html">Shop</a></li>

            <li><a href="About.html">About</a></li>

        </ul>

        <div class="hamburger" id="hamburger">
            <div class="line"></div>
            <div class="line"></div>
            <div class="line"></div>
        </div>

    </nav>

    <div class="container">

      <h1>EverydayBD</h1>

      <a 
        href="https://everydaybd.github.io/store"
        class="btn"
        target="_blank"
      >
        Enter EverydayBD
        <span class="arrow">➜</span>
      </a>

    </div>

    <script>

      const hamburger = document.getElementById("hamburger");
      const navLinks = document.getElementById("navLinks");

      hamburger.addEventListener("click", () => {
        navLinks.classList.toggle("active");
      });

    </script>

</body>
</html>
